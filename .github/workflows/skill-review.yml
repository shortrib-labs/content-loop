name: Tessl Skill Review
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review@main
        with:
          tessl-token: ${{ secrets.TESSL_TOKEN }}
          workspace: shortrib-labs   # the Shortrib Labs org's workspace
          fail-threshold: 0          # raise (e.g. 70) to gate merges once the baseline is trusted
